{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header bg-secondary text-white">🧠 Concept Explainer (AI)</div>
    <div class="card-body">
        <input type="text" id="topic" class="form-control" placeholder="e.g., DBMS normalization, binary search, array">
        <button id="explainBtn" class="btn btn-primary mt-2">Explain</button>
        <div id="explanation" class="mt-3"></div>
    </div>
</div>
<script>
document.getElementById('explainBtn').onclick = () => {
    let topic = document.getElementById('topic').value;
    fetch('/explain', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({topic: topic})
    }).then(r=>r.json()).then(d=>{
        document.getElementById('explanation').innerHTML = `<div class="alert alert-info">${d.explanation}</div>`;
    });
};
</script>
{% endblock %}
